name: Seed Luka Master Data

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to seed."
        required: true
        type: choice
        options:
          - staging
          - production
      confirm:
        description: "Type SEED_LUKA_MASTER_STAGING or SEED_LUKA_MASTER_PRODUCTION."
        required: true
        type: string
      deploy_migrations:
        description: "Apply pending Prisma migrations after backup and before seed."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: seed-luka-master-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed Luka master data
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'production' && 'Production' || 'staging' }}
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ inputs.target == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
      TARGET_ENVIRONMENT: ${{ inputs.target }}

    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            REQUIRED_CONFIRM="SEED_LUKA_MASTER_PRODUCTION"
          else
            REQUIRED_CONFIRM="SEED_LUKA_MASTER_STAGING"
          fi

          if [ "$CONFIRM" != "$REQUIRED_CONFIRM" ]; then
            echo "::error::Confirmation must be exactly ${REQUIRED_CONFIRM}."
            exit 1
          fi

      - name: Validate database secret
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            if [ "$TARGET_ENVIRONMENT" = "production" ]; then
              echo "::error::Missing PRODUCTION_DATABASE_URL secret in the Production environment."
            else
              echo "::error::Missing STAGING_DATABASE_URL secret in the staging environment."
            fi
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "PG_DUMP_BIN=/usr/lib/postgresql/18/bin/pg_dump" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @luka/database run generate

      - name: Prepare pg_dump connection
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const url = new URL(process.env.DATABASE_URL);
          url.searchParams.delete("schema");
          console.log(`PG_DUMP_DATABASE_URL=${url.toString()}`);
          NODE

      - name: Backup database before seed
        run: |
          set -euo pipefail
          mkdir -p backups
          BACKUP_FILE="backups/luka-${TARGET_ENVIRONMENT}-pre-master-seed-$(date -u +'%Y%m%dT%H%M%SZ').sql.gz"
          "$PG_DUMP_BIN" --dbname="$PG_DUMP_DATABASE_URL" --no-owner --no-acl | gzip > "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          test -s "$BACKUP_FILE"

      - name: Upload pre-seed backup
        uses: actions/upload-artifact@v6
        with:
          name: luka-${{ inputs.target }}-pre-master-seed-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14

      - name: Check migration status before seed
        id: migrate_status
        continue-on-error: true
        run: pnpm --filter @luka/database exec prisma migrate status --schema=./prisma/schema.prisma

      - name: Stop if migrations are pending
        if: steps.migrate_status.outcome == 'failure' && inputs.deploy_migrations != true
        run: |
          echo "::error::Pending migrations detected. Re-run with deploy_migrations=true after reviewing the backup artifact."
          exit 1

      - name: Deploy pending migrations
        if: steps.migrate_status.outcome == 'failure' && inputs.deploy_migrations == true
        run: pnpm --filter @luka/database run migrate:deploy

      - name: Check migration status after deploy
        if: steps.migrate_status.outcome == 'failure' && inputs.deploy_migrations == true
        run: pnpm --filter @luka/database exec prisma migrate status --schema=./prisma/schema.prisma

      - name: Run Luka master seed
        run: pnpm --filter @luka/database seed:luka-master

      - name: Validate seeded Luka master data
        run: |
          cd packages/database
          node <<'JS'
          const { PrismaClient } = require("@prisma/client");

          const prisma = new PrismaClient();

          (async () => {
            const org = await prisma.organization.findFirstOrThrow({
              where: { rfc: "LUK240101AAA" },
              select: { id: true },
            });

            const [activeBranches, cedisBranches, products, categories] = await Promise.all([
              prisma.branch.count({ where: { organizationId: org.id, isActive: true } }),
              prisma.branch.count({
                where: { organizationId: org.id, code: "CEDIS01", isActive: true },
              }),
              prisma.product.count({ where: { organizationId: org.id, isActive: true } }),
              prisma.productCategory.count({ where: { organizationId: org.id } }),
            ]);

            console.log({
              activeBranches,
              cedisBranches,
              products,
              categories,
            });

            if (activeBranches < 11) throw new Error("Expected at least 11 active branches.");
            if (cedisBranches !== 1) throw new Error("Expected exactly one active CEDIS01 branch.");
            if (products < 183) throw new Error("Expected at least 183 active products.");
            if (categories < 21) throw new Error("Expected at least 21 product categories.");
          })()
            .finally(async () => {
              await prisma.$disconnect();
            })
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          JS
